py3:
  name: "Python 3"

  default_run_limits:
    wall_time_s: 9
    memory_kb: 102400
    max_processes: 100

  extension: ".py"

  version_command:
    command: "python3"
    args:
      - "--version"

  run:
    - "python3"
    - "{source}"

cpp:
  name: "C++"

  default_run_limits:
    wall_time_s: 9
    memory_kb: 102400
    max_processes: 100

  extension: ".cpp"

  version_command:
    command: "g++"
    args:
      - "--version"

  compile:
    - "g++"
    - "{source}"
    - "-o"
    - "{artifact}"

  run:
    - "{artifact}"